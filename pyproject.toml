[project]
name = "miniclaw"
version = "0.5.0"
description = "A lightweight AI assistant with memory, DIKW layers, and three-layer routing"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
miniclaw = "miniclaw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
